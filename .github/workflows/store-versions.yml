# Hourly: the app version live on the Play Store and the App Store into
# versions.json, committed when it changes (the changelog hides, on a phone,
# the versions its store doesn't have yet). See tool/store_versions.py.
name: Store versions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "pyjwt[crypto]==2.10.1" "requests==2.32.3"

      - name: Read the stores
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python tool/store_versions.py

      - name: Commit when changed
        run: |
          if git diff --quiet versions.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "[CHORE] Store versions: $(tr -d '\n ' < versions.json)"
          git push
